name: Update Version Catalog

on:
  workflow_call:
    inputs:
      minecraft_version:
        description: 'Minecraft Version'
        required: true
        type: string
      branch:
        description: 'Branch'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: false
        type: string
        default: Automations
      commit_directly:
        description: 'Commit directly'
        required: false
        type: boolean
        default: false
      update_plugins:
        description: 'Update Plugins'
        required: false
        type: boolean
        default: false
    secrets:
      AUTOMATIONS_APP_ID:
        required: true
      AUTOMATIONS_PRIVATE_KEY:
        required: true
    outputs:
      updated:
        description: 'Whether the catalog was updated'
        value: ${{ jobs.update-version-catalog.outputs.updated }}
      minecraft_version:
        description: 'Minecraft Version'
        value: ${{ jobs.update-version-catalog.outputs.minecraft_version }}
      minecraft_updated:
        description: 'Whether the Minecraft version was updated'
        value: ${{ jobs.update-version-catalog.outputs.minecraft_updated }}
      fabric_api_updated:
        description: 'Whether the Fabric API version was updated'
        value: ${{ jobs.update-version-catalog.outputs.fabric_api_updated }}
      fabric_api_present:
        description: 'Whether a Fabric API version is present'
        value: ${{ jobs.update-version-catalog.outputs.fabric_api_present }}
      fabric_loader_updated:
        description: 'Whether the Fabric Loader version was updated'
        value: ${{ jobs.update-version-catalog.outputs.fabric_loader_updated }}
      fabric_loader_present:
        description: 'Whether a Fabric Loader version is present'
        value: ${{ jobs.update-version-catalog.outputs.fabric_loader_present }}
      neoform_updated:
        description: 'Whether the NeoForm version was updated'
        value: ${{ jobs.update-version-catalog.outputs.neoform_updated }}
      neoform_present:
        description: 'Whether a NeoForm version is present'
        value: ${{ jobs.update-version-catalog.outputs.neoform_present }}
      neoforge_updated:
        description: 'Whether the NeoForge version was updated'
        value: ${{ jobs.update-version-catalog.outputs.neoforge_updated }}
      neoforge_present:
        description: 'Whether a NeoForge version is present'
        value: ${{ jobs.update-version-catalog.outputs.neoforge_present }}
      forge_updated:
        description: 'Whether the Forge version was updated'
        value: ${{ jobs.update-version-catalog.outputs.forge_updated }}
      forge_present:
        description: 'Whether a Forge version is present'
        value: ${{ jobs.update-version-catalog.outputs.forge_present }}
      balm_updated:
        description: 'Whether the Balm version was updated'
        value: ${{ jobs.update-version-catalog.outputs.balm_updated }}
      balm_present:
        description: 'Whether a Balm version is present'
        value: ${{ jobs.update-version-catalog.outputs.balm_present }}
      fabric_api_version:
        description: 'Fabric API Version'
        value: ${{ jobs.update-version-catalog.outputs.fabric_api_version }}
      fabric_loader_version:
        description: 'Fabric Loader Version'
        value: ${{ jobs.update-version-catalog.outputs.fabric_loader_version }}
      neoform_version:
        description: 'NeoForm Version'
        value: ${{ jobs.update-version-catalog.outputs.neoform_version }}
      neoforge_version:
        description: 'NeoForge Version'
        value: ${{ jobs.update-version-catalog.outputs.neoforge_version }}
      forge_version:
        description: 'Forge Version'
        value: ${{ jobs.update-version-catalog.outputs.forge_version }}
      balm_version:
        description: 'Balm Version'
        value: ${{ jobs.update-version-catalog.outputs.balm_version }}
      java_version:
        description: 'Java Version'
        value: ${{ jobs.update-version-catalog.outputs.java_version }}
      loom_version:
        description: 'Loom Version'
        value: ${{ jobs.update-version-catalog.outputs.loom_version }}
      mdg_version:
        description: 'MDG Version'
        value: ${{ jobs.update-version-catalog.outputs.mdg_version }}
      loom_present:
        description: 'Whether a Loom version is present'
        value: ${{ jobs.update-version-catalog.outputs.loom_present }}
      loom_updated:
        description: 'Whether the Loom version was updated'
        value: ${{ jobs.update-version-catalog.outputs.loom_updated }}
      mdg_updated:
        description: 'Whether the ModDevGradle version was updated'
        value: ${{ jobs.update-version-catalog.outputs.mdg_updated }}
      mdg_present:
        description: 'Whether a ModDevGradle version is present'
        value: ${{ jobs.update-version-catalog.outputs.mdg_present }}
jobs:
  update-version-catalog:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      updated: ${{ steps.update-catalog.outputs.updated }}
      minecraft_updated: ${{ steps.update-minecraft.outputs.updated }}
      fabric_api_updated: ${{ steps.update-fabric-api.outputs.updated }}
      fabric_api_present: ${{ steps.fabric-api.outputs.version != '' }}
      fabric_loader_updated: ${{ steps.update-fabric-loader.outputs.updated }}
      fabric_loader_present: ${{ steps.fabric-loader.outputs.version != '' }}
      neoform_updated: ${{ steps.update-neoform.outputs.updated }}
      neoform_present: ${{ steps.neoform.outputs.version != '' }}
      neoforge_updated: ${{ steps.update-neoforge.outputs.updated }}
      neoforge_present: ${{ steps.neoforge.outputs.version != '' }}
      forge_updated: ${{ steps.update-forge.outputs.updated }}
      forge_present: ${{ steps.forge.outputs.version != '' }}
      balm_updated: ${{ steps.update-balm.outputs.updated }}
      balm_present: ${{ steps.balm.outputs.version != '' }}
      minecraft_version: ${{ steps.minecraft.outputs.version }}
      fabric_api_version: ${{ steps.fabric-api.outputs.version }}
      fabric_loader_version: ${{ steps.fabric-loader.outputs.version }}
      neoform_version: ${{ steps.neoform.outputs.version }}
      neoforge_version: ${{ steps.neoforge.outputs.version }}
      mdg_version: ${{ steps.mdg.outputs.version }}
      mdg_updated: ${{ steps.update-mdg.outputs.updated }}
      mdg_present: ${{ steps.mdg.outputs.version != '' }}
      forge_version: ${{ steps.forge.outputs.version }}
      balm_version: ${{ steps.balm.outputs.version }}
      java_version: ${{ steps.java.outputs.version }}
      loom_version: ${{ steps.loom.outputs.version }}
      loom_present: ${{ steps.loom.outputs.version != '' }}
      loom_updated: ${{ steps.update-loom.outputs.updated }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.AUTOMATIONS_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
      - name: Normalize Minecraft Version
        id: normalize-minecraft-version
        uses: TwelveIterations/bump-version@v1
        with:
          version: "${{ inputs.minecraft_version }}"
          format: "a.b.c"
      - name: Get Minecraft Version
        id: minecraft
        uses: TwelveIterations/get-minecraft-version@v1
        continue-on-error: true
        with:
          version: "${{ inputs.minecraft_version }}"
      - name: Get Java Version
        id: java
        run: |
          echo "version=25" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Get Fabric API Version
        id: fabric-api
        uses: TwelveIterations/get-fabric-api-version@v1
        continue-on-error: true
        with:
          minecraftVersion: "${{ inputs.minecraft_version }}"
      - name: Get Fabric Loader Version
        id: fabric-loader
        uses: TwelveIterations/get-fabric-loader-version@v1
        continue-on-error: true
      - name: Get NeoForm Version
        id: neoform
        uses: TwelveIterations/get-neoform-version@v1
        continue-on-error: true
        with:
          version: "${{ steps.minecraft.outputs.version }}-*"
      - name: Get NeoForge Version
        id: neoforge
        uses: TwelveIterations/get-neoforge-version@v1
        continue-on-error: true
        with:
          version: "${{ steps.normalize-minecraft-version.outputs.version }}.*"
      - name: Get ModDevGradle Version
        id: mdg
        if: inputs.update_plugins == true
        uses: TwelveIterations/get-neoforged-version@v1
        continue-on-error: true
        with:
          artifact: moddev-gradle
          version: "2.*"
      - name: Get Loom Version
        id: loom
        if: inputs.update_plugins == true
        run: |
          echo "version=1.14-SNAPSHOT" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Get Forge Version
        id: forge
        uses: TwelveIterations/get-forge-version@v1
        continue-on-error: true
        with:
          minecraftVersion: "${{ inputs.minecraft_version }}"
          channel: "latest"
      - name: Get Balm Version
        id: balm
        uses: TwelveIterations/get-nexus-version@v1
        continue-on-error: true
        with:
          nexusUrl: 'https://maven.twelveiterations.com'
          repository: 'maven-releases'
          groupId: 'net.blay09.mods'
          artifactId: 'balm-common'
          version: '${{ steps.normalize-minecraft-version.outputs.version }}.*'
      - name: Update Minecraft
        id: update-minecraft
        if: steps.minecraft.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: com.mojang:minecraft
          version: ${{ steps.minecraft.outputs.version }}
      - name: Update ModDevGradle
        id: update-mdg
        if: steps.mdg.outputs.version != '' && inputs.update_plugins == true
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          plugin: net.neoforged.moddev
          version: ${{ steps.mdg.outputs.version }}
      - name: Update Loom
        id: update-loom
        if: steps.loom.outputs.version != '' && inputs.update_plugins == true
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          plugin: net.fabricmc.fabric-loom
          version: ${{ steps.loom.outputs.version }}
      - name: Update Fabric API
        id: update-fabric-api
        if: steps.fabric-api.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: net.fabricmc.fabric-api:fabric-api
          version: ${{ steps.fabric-api.outputs.version }}
      - name: Update Fabric Loader
        id: update-fabric-loader
        if: steps.fabric-loader.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: net.fabricmc:fabric-loader
          version: ${{ steps.fabric-loader.outputs.version }}
      - name: Update NeoForm
        id: update-neoform
        if: steps.neoform.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: net.neoforged:neoform
          version: ${{ steps.neoform.outputs.version }}
      - name: Update NeoForge
        id: update-neoforge
        if: steps.neoforge.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: net.neoforged:neoforge
          version: ${{ steps.neoforge.outputs.version }}
      - name: Update Forge
        id: update-forge
        if: steps.forge.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: net.minecraftforge:forge
          version: ${{ steps.forge.outputs.version }}
      - name: Update Balm
        id: update-balm
        if: steps.balm.outputs.version != ''
        uses: TwelveIterations/update-gradle-version-catalog@v1
        with:
          library: net.blay09.mods:balm-common
          version: ${{ steps.balm.outputs.version }}
      - name: Update version catalog
        run: |
          # Check if there are changes
          if git diff --quiet gradle/libs.versions.toml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
        id: update-catalog
      - name: Create Pull Request
        if: steps.update-catalog.outputs.updated == 'true' && inputs.commit_directly == false
        run: |
          # Create and checkout branch
          git checkout -b automations/update-version-catalog-${{ github.run_number }}
          
          # Add and commit changes
          git add gradle/libs.versions.toml
          git commit -m "Update version catalog"
          
          # Push branch to remote
          git push origin automations/update-version-catalog-${{ github.run_number }}
          
          # Create pull request using GitHub CLI
          gh pr create \
            --title "Update version catalog" \
            --body "## Version Catalog Updates
            
          This PR updates the version catalog to use the following versions:
          - **Fabric API**: ${{ steps.fabric-api.outputs.version }}
          - **Fabric Loader**: ${{ steps.fabric-loader.outputs.version }}
          - **NeoForm**: ${{ steps.neoform.outputs.version }}
          - **NeoForge**: ${{ steps.neoforge.outputs.version }}
          - **Forge**: ${{ steps.forge.outputs.version }}
          - **Balm**: ${{ steps.balm.outputs.version }}
          
          This PR was automatically created by the Update Version Catalog workflow." \
            --base ${{ inputs.branch }} \
            --head automations/update-version-catalog-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Commit and push directly
        if: steps.update-catalog.outputs.updated == 'true' && inputs.commit_directly == true
        run: |
          git add gradle/libs.versions.toml
          git commit -m "Update version catalog"
          git push origin ${{ inputs.branch }}
      - name: No update needed
        if: steps.update-catalog.outputs.updated == 'false'
        run: |
          echo "Version catalog is already up to date"
