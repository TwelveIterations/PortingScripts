name: Apply Rewrite

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to apply recipes to'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: false
        type: string
        default: Automations
      migrations:
        description: 'Migration repository with ref and optional path (format: org/repo@ref/path)'
        required: true
        type: string
      java_version:
        description: 'Java Version'
        required: false
        type: string
        default: '25'
    secrets:
      AUTOMATIONS_APP_ID:
        required: true
      AUTOMATIONS_PRIVATE_KEY:
        required: true

jobs:
  apply-recipes:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Authenticate GitHub App
        id: configure-git
        uses: TwelveIterations/PortingScripts/.github/actions/configure-git@v1
        with:
          app-id: ${{ secrets.AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.AUTOMATIONS_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.configure-git.outputs.token }}
          ref: ${{ inputs.branch }}
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Checkout repository for recipes
        id: checkout-recipes
        uses: TwelveIterations/PortingScripts/.github/actions/checkout-migrations@v1
        with:
          migrations: ${{ inputs.migrations }}
          path: recipes-repo
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
      - name: Run pre hooks
        uses: TwelveIterations/PortingScripts/.github/actions/run-hooks@v1
        with:
          hooks-directory: hooks/apply-rewrite/pre
      - name: Apply recipes
        id: apply-recipes
        run: |
          RECIPES_DIR="${{ steps.checkout-recipes.outputs.path }}/recipes"
          
          if [ -z "$RECIPES_DIR" ] || [ ! -d "$RECIPES_DIR" ]; then
            echo "No recipes directory found"
            echo "recipes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "Looking for recipes in: $RECIPES_DIR"
          
          # Find all recipe files
          RECIPE_FILES=$(find "$RECIPES_DIR" -name "*.yml" -type f | sort)
          
          if [ -z "$RECIPE_FILES" ]; then
            echo "No recipe files found in $RECIPES_DIR"
            echo "recipes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "Found recipe files:"
          echo "$RECIPE_FILES"
          
          # OpenRewrite needs a single rewrite.yml file with all recipes
          echo "" > recipes-repo/rewrite.yml
          
          ACTIVE_RECIPES=""
          
          for recipe_file in $RECIPE_FILES; do
            recipe_name=$(basename "$recipe_file")
            
            echo "---" >> recipes-repo/rewrite.yml
            cat "$recipe_file" >> recipes-repo/rewrite.yml
            echo "" >> recipes-repo/rewrite.yml
            
            # Extract recipe name from YAML file
            extracted_name=$(grep "^name:" "$recipe_file" | cut -d: -f2- | sed 's/^ *//' | tr -d '\r\n')
            if [ -n "$extracted_name" ]; then
              if [ -z "$ACTIVE_RECIPES" ]; then
                ACTIVE_RECIPES="$extracted_name"
              else
                ACTIVE_RECIPES="$ACTIVE_RECIPES,$extracted_name"
              fi
            fi
          done
          
          echo "Active recipes: $ACTIVE_RECIPES"
          
          # Create rewrite.gradle in the recipes directory
          GRADLE_REWRITE_INIT_SCRIPT="${{ steps.checkout-recipes.outputs.path }}/rewrite.gradle"
          echo "initscript {" > "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    repositories {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "        gradlePluginPortal()" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    }" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    dependencies {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "        classpath('org.openrewrite:plugin:latest.release')" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    }" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "}" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "rootProject {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    plugins.apply(org.openrewrite.gradle.RewritePlugin)" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    dependencies {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "        rewrite('org.openrewrite.recipe:rewrite-gradle:latest.release')" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    }" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "    afterEvaluate {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "        if (repositories.isEmpty()) {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "            repositories {" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "                mavenCentral()" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "            }" >> "$GRADLE_REWRITE_INIT_SCRIPT"
          echo "        }" >> "$GRADLE_REWRITE_INIT_SCRIPT"

          # Run Gradle rewrite task if we have recipes
          if [ -n "$ACTIVE_RECIPES" ]; then
            ./gradlew rewriteRun --init-script="$GRADLE_REWRITE_INIT_SCRIPT" -Drewrite.activeRecipe="$ACTIVE_RECIPES"
            # Commit any changes made by rewrite (excluding recipes checkout directory)
            git add .
            git reset HEAD "${{ steps.checkout-recipes.outputs.path }}" 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Apply automated code migrations"
              git push origin "${{ inputs.branch }}"
            fi
          else
            echo "No active recipes found, skipping rewrite"
          fi

          echo "recipes=$ACTIVE_RECIPES" >> "$GITHUB_OUTPUT"
      - name: Run post hooks
        uses: TwelveIterations/PortingScripts/.github/actions/run-hooks@v1
        with:
          hooks-directory: hooks/apply-rewrite/post
    outputs:
      recipes: ${{ steps.apply-recipes.outputs.recipes }}
